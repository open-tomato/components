# The minimal check GitHub runs on every pull request: the privacy and
# control-byte gates, lint, types, the build, and the unit and render tests.
#
# The visual suite does not run here. Its baselines are per machine and stay
# on the developer's machine, untracked (packages/ui/README.md, "CI").
#
# Actions are pinned by commit SHA, with the release tag beside each pin, so a
# moved tag cannot change what runs. The token can only read the repository.
name: verify

on:
  pull_request:
    branches:
      - main
      - integration
      - 'stretch/**'
  push:
    branches:
      - 'stretch/**'

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The privacy gate reads every commit, so the job needs history.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Privacy
        if: ${{ !cancelled() }}
        run: bun run gate:privacy:history

      - name: Control bytes
        if: ${{ !cancelled() }}
        run: bun run gate:control-bytes

      - name: Lint
        if: ${{ !cancelled() }}
        run: bun run lint:all

      - name: Types
        if: ${{ !cancelled() }}
        run: bun run check-types:all

      - name: Tool tests
        if: ${{ !cancelled() }}
        run: bun test tools

      - name: Build
        if: ${{ !cancelled() }}
        working-directory: packages/ui
        run: bun run build

      - name: Unit tests
        if: ${{ !cancelled() }}
        working-directory: packages/ui
        run: bunx vitest run --project unit

      - name: Render tests
        if: ${{ !cancelled() }}
        working-directory: packages/ui
        run: bun run test:render
