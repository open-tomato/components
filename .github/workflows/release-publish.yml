# Publishes one package to npm when its release tag is pushed, with npm
# trusted publishing: npm trusts this workflow's OIDC identity token, so no
# npm token is stored anywhere, and npm attaches provenance on its own.
#
# A tag names the package and the version it releases:
#
#   @open-tomato/components@<version>  ->  packages/ui
#   @open-tomato/charts@<version>      ->  packages/charts
#
# The job refuses a tag whose version differs from the package's
# package.json, and skips a version the registry already holds, so a pushed
# tag can never publish anything but the commit's own manifest.
#
# Each package needs a trusted publisher on npmjs.com (package Settings,
# Trusted publishing, GitHub Actions) naming the open-tomato organization,
# the components repository and this file, release-publish.yml.
#
# The publish job runs only when the repository variable
# RAFA_RELEASE_PUBLISH is `ci`. Unset, GitHub skips the job and the run
# stays green, so the workflow can land before the trusted publishers exist:
#
#   gh variable set RAFA_RELEASE_PUBLISH --body ci --repo open-tomato/components
#
# Actions are pinned by commit SHA, with the release tag beside each pin, so
# a moved tag cannot change what runs. The token can only read the
# repository; the publish job adds the OIDC token npm needs.
name: release-publish

on:
  push:
    tags:
      - '@open-tomato/components@*'
      - '@open-tomato/charts@*'

permissions:
  contents: read

concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: vars.RAFA_RELEASE_PUBLISH == 'ci'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The privacy gate reads every commit, so the job needs history.
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the package
        id: package
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG%@*}"
          version="${TAG##*@}"
          case "$name" in
            @open-tomato/components) dir=packages/ui ;;
            @open-tomato/charts) dir=packages/charts ;;
            *) echo "::error::tag $TAG names no package this workflow publishes"; exit 1 ;;
          esac
          manifest_name=$(node -p "require('./$dir/package.json').name")
          manifest_version=$(node -p "require('./$dir/package.json').version")
          if [ "$manifest_name" != "$name" ] || [ "$manifest_version" != "$version" ]; then
            echo "::error::tag $TAG does not match $dir/package.json ($manifest_name@$manifest_version)"
            exit 1
          fi
          {
            echo "name=$name"
            echo "version=$version"
            echo "dir=$dir"
          } >> "$GITHUB_OUTPUT"

      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Set up node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or newer.
      - name: Upgrade npm
        run: npm install -g 'npm@^11.5.1' && npm --version

      - name: Install
        run: bun install --frozen-lockfile

      - name: Privacy
        run: bun run gate:privacy:history

      - name: Control bytes
        run: bun run gate:control-bytes

      - name: Lint
        run: bun run lint:all

      - name: Types
        run: bun run check-types:all

      - name: Tool tests
        run: bun test tools

      - name: Build
        working-directory: ${{ steps.package.outputs.dir }}
        run: bun run build

      - name: Tests (components)
        if: ${{ steps.package.outputs.dir == 'packages/ui' }}
        working-directory: packages/ui
        run: bunx vitest run --project unit && bun run test:render

      - name: Tests (charts)
        if: ${{ steps.package.outputs.dir == 'packages/charts' }}
        working-directory: packages/charts
        run: bun run test

      - name: Skip a published version
        id: registry
        shell: bash
        env:
          SPEC: ${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }}
        run: |
          if npm view "$SPEC" version > /dev/null 2>&1; then
            echo "::notice::$SPEC is already on npm; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: ${{ steps.registry.outputs.published == 'false' }}
        working-directory: ${{ steps.package.outputs.dir }}
        run: npm publish --access public
